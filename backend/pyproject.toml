[project]
name = "domeye-core"
version = "0.1.0"
description = "Domeye 路由异常检测核心精简版后端"
requires-python = ">=3.10,<3.11"
dependencies = [
    "flask",
    "flask-cors",
    "flask-restful",
    "jsonschema[format-nongpl]==4.25.1",
    "networkx",
    "numpy",
    "openpyxl",
    "pandas",
    "psycopg2-binary",
    "pyinotify; sys_platform == 'linux'",
    "python-dateutil",
    "pytricia",
    "requests",
    "xlrd",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[[tool.uv.dependency-metadata]]
name = "pyinotify"
version = "0.9.6"
requires-dist = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["web/tests"]
