<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domeye · 问数</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar" aria-label="会话导航">
    <a class="brand" href="/" aria-label="Domeye 问数首页"><span class="brand-mark" aria-hidden="true">d.</span><span>Domeye<small>从问题到依据</small></span></a>
    <label class="dataset-label" for="dataset">新会话使用的数据</label>
    <select id="dataset" class="dataset-select" aria-label="新会话使用的数据"></select>
    <label class="dataset-label model-label" for="model">新会话使用的模型</label>
    <select id="model" class="dataset-select" aria-label="新会话使用的模型"></select>
    <button id="new-session" class="new-button" type="button"><span aria-hidden="true">＋</span> 开始新会话</button>
    <div class="history-heading"><h2>会话记录</h2><button id="refresh-history" class="icon-button" type="button" aria-label="刷新会话记录">↻</button></div>
    <button id="current-session" class="current-button" type="button">当前会话 <span>进行中</span></button>
    <nav id="history" aria-label="历史会话"></nav>
    <p class="sidebar-note">记录保存在服务端。<br>历史会话以只读方式打开。</p>
  </aside>
  <main>
    <header class="topbar"><div><span class="eyebrow">DOMEYE / 数据问答</span><h1 id="session-title">当前会话</h1><p id="session-dataset" class="session-dataset"></p></div><span id="connection" class="connection">正在连接</span></header>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="reading-pane" class="reading-pane" aria-label="会话内容">
      <div id="empty" class="empty-state"><div class="rule"></div><p class="eyebrow">先问一个问题</p><h2>你想了解<br>这份数据的什么？</h2><p>用日常语言提问。Domeye 会查阅说明、读取数据，<br class="wide-only">并在回答中说明依据与尚不能确定的部分。</p></div>
      <div id="messages" class="messages" role="log" aria-label="问答记录"></div>
    </section>
    <footer class="composer-area">
      <div id="read-only" class="read-only" hidden><span>正在阅读已保存的会话</span><button id="back-current" type="button">回到当前会话 →</button></div>
      <form id="composer" class="composer">
        <label class="sr-only" for="question">输入问题</label>
        <textarea id="question" rows="2" maxlength="4000" placeholder="输入问题，也可以接着追问…"></textarea>
        <div class="composer-bottom"><span id="composer-hint">Enter 发送 · Shift + Enter 换行</span><button id="stop" class="stop-button" type="button" hidden>■ 停止</button><button id="send" class="send-button" type="submit">发送 <span aria-hidden="true">↑</span></button></div>
      </form>
      <p class="footnote">仅使用本项目已交付结果。数据范围在查询时确认，无法确定时会说明。</p>
    </footer>
  </main>
</body>
</html>
